<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Games · BlazePwifi</title><style>:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;background:#07111f;color:#f5f9ff}.shell{max-width:900px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center}.back{color:#8bb8ff;text-decoration:none}.hero,.card{border:1px solid #ffffff18;background:#ffffff0b;border-radius:22px;padding:20px;margin-top:16px}.hero h1{margin:4px 0}.muted{color:#93a8c2}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.tile{min-height:160px;border:1px solid #ffffff14;border-radius:18px;padding:16px;background:#0c192a}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#23324b;font-size:12px}.good{background:#063c29;color:#72edb0}.lock{background:#4e221c;color:#ffaca1}.empty{text-align:center;padding:48px 18px}.btn{border:0;border-radius:13px;padding:12px 16px;background:#465fff;color:white;font-weight:800;cursor:pointer}</style></head><body><main class="shell"><div class="top"><b>BlazeGames</b><a class="back" href="/">← Portal</a></div><section class="hero"><span id="access" class="badge">Checking session…</span><h1>Local Arcade</h1><p id="session" class="muted">Checking your session…</p></section><section class="card"><div class="empty"><h2>BlazeGames library</h2><p class="muted">Games enabled by the operator will appear here. Administrator-supplied ROMs can be FREE or require active, unpaused paid time.</p></div></section></main><script>
const token=localStorage.getItem('blazeDevice')||'';const post=async(a,d)=>{let b=new URLSearchParams(Object.assign({action:a,device:token},d||{}));try{return await (await fetch('/cgi-bin/api',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:b})).json()}catch(e){return {ok:false}}};
async function state(){let x=await post('me');let active=!!(x.ok&&!x.paused&&(+x.remaining_seconds)>0);document.getElementById('access').textContent=active?'ACTIVE TIME · PAID CONTENT UNLOCKED':'FREE CONTENT ONLY';document.getElementById('access').className='badge '+(active?'good':'lock');document.getElementById('session').textContent=x.ok?(x.paused?'Your time is paused. Paid content stays locked.':active?'Your paid time is running.':'Insert coin or buy time to unlock paid content.'):'Connect through the BlazePwifi portal first.';}state();setInterval(state,5000);
</script></body></html>
