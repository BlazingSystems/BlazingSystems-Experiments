<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BlazePwifi</title><style>
:root{font-family:system-ui,sans-serif;color-scheme:dark}body{margin:0;background:#0d1117;color:#e6edf3}.wrap{max-width:720px;margin:auto;padding:24px}.brand{font-size:2rem;font-weight:800}.card{background:#161b22;border:1px solid #30363d;border-radius:18px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat{background:#0d1117;border-radius:12px;padding:12px}.big{font-size:1.45rem;font-weight:700}button,input,select{font:inherit;border-radius:11px;border:1px solid #30363d;padding:12px;background:#0d1117;color:#e6edf3}button{background:#238636;color:#fff;font-weight:700;cursor:pointer}button.alt{background:#21262d}button:disabled{opacity:.5}.rates{display:flex;flex-wrap:wrap;gap:8px}.msg{min-height:1.4em;color:#8b949e}.good{color:#3fb950}.bad{color:#f85149}.row{display:flex;gap:8px;flex-wrap:wrap}</style></head><body><div class="wrap">
<div class="brand">🔥 BlazePwifi</div><div class="msg">Prepaid access stored to this browser, even if your phone changes its private Wi-Fi MAC.</div>
<div class="card"><div class="grid"><div class="stat"><small>Credit</small><div class="big" id="credit">—</div></div><div class="stat"><small>Time remaining</small><div class="big" id="time">—</div></div><div class="stat"><small>Status</small><div class="big" id="status">—</div></div><div class="stat"><small>Network identity</small><div id="device">—</div></div></div></div>
<div class="card"><h3>Insert coin</h3><p>Select the physical Blaze Vendo you are using. If only one is online it is selected automatically.</p><div class="row"><select id="vendo"></select><button id="coin" onclick="coinStart()">Start coin insert</button><button class="alt" onclick="coinStop()">Stop</button></div><div id="coinmsg" class="msg"></div></div>
<div class="card"><h3>Connect / extend</h3><div id="rates" class="rates"></div><div class="row" style="margin-top:12px"><button class="alt" onclick="pauseNow()">Pause time</button><button class="alt" onclick="resumeNow()">Resume time</button><button class="alt" onclick="disconnectNow()">End session</button></div></div>
<div class="card"><h3>Voucher</h3><input id="voucher" placeholder="Voucher code"><button onclick="redeem()">Redeem</button><div id="vmsg" class="msg"></div></div>
<script>
const api='/cgi-bin/api';
function makeDevice(){const a=new Uint8Array(16);if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(a);else for(let i=0;i<a.length;i++)a[i]=Math.floor(Math.random()*256);return Array.from(a,x=>x.toString(16).padStart(2,'0')).join('')}
let deviceToken=localStorage.getItem('blazeDevice')||'';if(!/^[0-9a-f]{32,64}$/.test(deviceToken)){deviceToken=makeDevice();localStorage.setItem('blazeDevice',deviceToken)}
async function call(action,data={}){const body=new URLSearchParams({action,device:deviceToken,...data});const r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});return r.json()}
function money(c){return '₱'+(c/100).toFixed(2)}
function dur(s){if(!s)return '0m';const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=s%60;return h?(`${h}h ${m}m`):(`${m}m ${x}s`)}
async function refresh(){try{const x=await call('me');if(x.ok){credit.textContent=money(x.credit_cents);time.textContent=dur(x.remaining_seconds);status.textContent=x.paused?'Paused':(x.remaining_seconds?'Online':'Offline');device.textContent=x.mac+' · '+x.ip}}catch(e){}}
async function loadRates(){const x=await call('rates');if(!x.ok)return;rates.innerHTML='';x.rates.forEach(r=>{const b=document.createElement('button');b.textContent=r.label;b.onclick=async()=>{const y=await call('connect',{cents:r.cents});alert(y.ok?'Session updated':y.error);refresh()};rates.appendChild(b)})}
async function loadVendos(){const x=await call('vendos');const old=vendo.value;vendo.innerHTML='';if(!x.ok||!x.vendos.length){let o=document.createElement('option');o.value='';o.textContent='No Vendo online';vendo.appendChild(o);return}x.vendos.forEach(v=>{let o=document.createElement('option');o.value=v.id;o.textContent=v.id;vendo.appendChild(o)});if(x.vendos.some(v=>v.id===old))vendo.value=old}
async function coinStart(){const x=await call('coin_start',{vendo:vendo.value});coinmsg.textContent=x.ok?('Coin window open on '+x.vendo+'. Insert coin now.'):x.error;coinmsg.className='msg '+(x.ok?'good':'bad')}
async function coinStop(){await call('coin_stop');coinmsg.textContent='Coin window closed.'}
async function pauseNow(){const x=await call('pause');if(!x.ok)alert(x.error);refresh()}
async function resumeNow(){const x=await call('resume');if(!x.ok)alert(x.error);refresh()}
async function redeem(){const x=await call('redeem',{code:voucher.value.trim()});vmsg.textContent=x.ok?'Voucher accepted.':x.error;vmsg.className='msg '+(x.ok?'good':'bad');refresh()}
async function disconnectNow(){if(!confirm('End this session and discard any remaining purchased time?'))return;const x=await call('disconnect');if(!x.ok)alert(x.error);refresh()}
loadRates();loadVendos();refresh();setInterval(refresh,3000);setInterval(loadVendos,10000);
</script></div></body></html>
