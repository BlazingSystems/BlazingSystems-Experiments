<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BlazePwifi Admin</title><style>body{font:16px system-ui;background:#0d1117;color:#e6edf3;max-width:760px;margin:auto;padding:24px}.card{background:#161b22;border:1px solid #30363d;border-radius:16px;padding:16px;margin:14px 0}input,button{font:inherit;padding:10px;border-radius:9px;border:1px solid #30363d}button{background:#238636;color:white;font-weight:700}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{background:#0d1117;padding:12px;border-radius:10px}</style></head><body><h1>🔥 BlazePwifi Admin</h1>
<div class="card"><input id="key" type="password" placeholder="Admin key"><button onclick="saveKey()">Unlock</button><small> Stored only in this browser tab.</small></div>
<div class="card"><div class="grid"><div class="metric">Sessions<br><b id="sessions">—</b></div><div class="metric">Vendos online<br><b id="vendos">—</b></div><div class="metric">Free memory<br><b id="mem">—</b></div><div class="metric">Load<br><b id="load">—</b></div></div></div>
<div class="card"><h3>Create voucher</h3><input id="cents" type="number" min="1" value="100"><button onclick="voucher()">Create</button><pre id="out"></pre></div>
<script>let token=sessionStorage.blazeAdmin||'';key.value=token;function saveKey(){token=key.value;sessionStorage.blazeAdmin=token;status()};async function a(action,data={}){const body=new URLSearchParams({action,...data});let r=await fetch('/cgi-bin/admin',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded','X-Blaze-Admin':token},body});return r.json()}async function status(){let x=await a('status');if(!x.ok){out.textContent=x.error;return}sessions.textContent=x.active_sessions;vendos.textContent=x.online_vendos;mem.textContent=x.mem_available_kb+' KB';load.textContent=x.load1}async function voucher(){let x=await a('voucher_create',{cents:cents.value});out.textContent=x.ok?`Voucher: ${x.code} (${x.cents} centavos)`:x.error}if(token)status();setInterval(()=>{if(token)status()},5000)</script></body></html>
