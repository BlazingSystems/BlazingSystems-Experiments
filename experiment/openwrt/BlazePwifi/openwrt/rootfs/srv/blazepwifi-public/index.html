<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BlazePwifi</title><style>
:root{font-family:system-ui,sans-serif;color-scheme:dark}body{margin:0;background:#0d1117;color:#e6edf3}.wrap{max-width:720px;margin:auto;padding:24px}.brand{font-size:2rem;font-weight:800}.card{background:#161b22;border:1px solid #30363d;border-radius:18px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat{background:#0d1117;border-radius:12px;padding:12px}.big{font-size:1.45rem;font-weight:700}button,input,select{font:inherit;border-radius:11px;border:1px solid #30363d;padding:12px}button{background:#238636;color:#fff;font-weight:700;cursor:pointer}button.alt{background:#21262d}button:disabled{opacity:.5}.rates{display:flex;flex-wrap:wrap;gap:8px}.msg{min-height:1.4em;color:#8b949e}.good{color:#3fb950}.bad{color:#f85149}</style></head><body><div class="wrap">
<div class="brand">🔥 BlazePwifi</div><div class="msg">Fast prepaid access, powered locally.</div>
<div class="card"><div class="grid"><div class="stat"><small>Credit</small><div class="big" id="credit">—</div></div><div class="stat"><small>Time remaining</small><div class="big" id="time">—</div></div><div class="stat"><small>Device</small><div id="device">—</div></div></div></div>
<div class="card"><h3>Insert coin</h3><p>Choose an online Vendo, open a coin window, then insert coins.</p><select id="vendo"></select> <button id="coin" onclick="coinStart()">Start coin insert</button> <button class="alt" onclick="coinStop()">Stop</button><div id="coinmsg" class="msg"></div></div>
<div class="card"><h3>Connect / extend</h3><div id="rates" class="rates"></div></div>
<div class="card"><h3>Voucher</h3><input id="voucher" placeholder="Voucher code"><button onclick="redeem()">Redeem</button><div id="vmsg" class="msg"></div></div>
<div class="card"><button class="alt" onclick="disconnectNow()">Disconnect session</button></div>
<script>
const api='/cgi-bin/api';
async function call(action,data={}){const body=new URLSearchParams({action,...data});const r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});return r.json()}
function money(c){return '₱'+(c/100).toFixed(2)} function dur(s){if(!s)return 'Offline';const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=s%60;return h?`${h}h ${m}m`:`${m}m ${x}s`}
async function refresh(){try{const x=await call('me');if(x.ok){credit.textContent=money(x.credit_cents);time.textContent=dur(x.remaining_seconds);device.textContent=x.mac+' · '+x.ip}}catch(e){} }
async function loadRates(){const x=await call('rates');if(!x.ok)return;rates.innerHTML='';x.rates.forEach(r=>{const b=document.createElement('button');b.textContent=r.label;b.onclick=async()=>{const y=await call('connect',{cents:r.cents});alert(y.ok?'Session updated':y.error);refresh()};rates.appendChild(b)})}
async function loadVendos(){const x=await call('vendos');vendo.innerHTML='';if(!x.ok||!x.vendos.length){vendo.innerHTML='<option value="">No Vendo online</option>';coin.disabled=true;return}x.vendos.forEach(v=>{const o=document.createElement('option');o.value=v.id;o.textContent=v.id;vendo.appendChild(o)});coin.disabled=false}async function coinStart(){const x=await call('coin_start',{vendo:vendo.value});coinmsg.textContent=x.ok?'Coin window open. Insert coin now.':x.error;coinmsg.className='msg '+(x.ok?'good':'bad')}
async function coinStop(){await call('coin_stop');coinmsg.textContent='Coin window closed.'}
async function redeem(){const x=await call('redeem',{code:voucher.value.trim()});vmsg.textContent=x.ok?'Voucher accepted.':x.error;vmsg.className='msg '+(x.ok?'good':'bad');refresh()}
async function disconnectNow(){const x=await call('disconnect');if(!x.ok)alert(x.error);refresh()}
loadRates();loadVendos();refresh();setInterval(refresh,3000);setInterval(loadVendos,5000);
</script></div></body></html>
