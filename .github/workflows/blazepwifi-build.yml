name: BlazePwifi release-candidate build
on:
  workflow_dispatch:
  push:
    paths:
      - 'experiment/openwrt/BlazePwifi/**'
      - '.github/workflows/blazepwifi-build.yml'
  pull_request:
    paths:
      - 'experiment/openwrt/BlazePwifi/**'
      - '.github/workflows/blazepwifi-build.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static validation
        run: sh experiment/openwrt/BlazePwifi/tests/static.sh
      - name: Accounting integration test
        run: sh experiment/openwrt/BlazePwifi/tests/integration.sh
      - name: Security regression test
        run: sh experiment/openwrt/BlazePwifi/tests/security.sh
      - name: Build source bundle
        run: |
          VERSION=$(cat experiment/openwrt/BlazePwifi/VERSION)
          tar -czf "BlazePwifi-${VERSION}-source.tar.gz" experiment/openwrt/BlazePwifi
          sha256sum "BlazePwifi-${VERSION}-source.tar.gz" > "BlazePwifi-${VERSION}-source.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: BlazePwifi-1.0.0-rc1-source
          path: |
            BlazePwifi-*-source.tar.gz
            BlazePwifi-*-source.tar.gz.sha256

  esp8266:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP8266 core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266
      - name: Compile flashable ESP8266 Vendo firmware
        run: |
          mkdir -p esp-out
          arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 --output-dir esp-out experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo
          BIN=$(find esp-out -maxdepth 1 -type f -name '*.bin' | head -n1)
          test -n "$BIN"
          cp "$BIN" BlazePwifi-Vendo-1.0.0-rc1-esp8266.bin
          sha256sum BlazePwifi-Vendo-1.0.0-rc1-esp8266.bin > BlazePwifi-Vendo-1.0.0-rc1-esp8266.bin.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: BlazePwifi-1.0.0-rc1-esp8266
          path: |
            BlazePwifi-Vendo-1.0.0-rc1-esp8266.bin
            BlazePwifi-Vendo-1.0.0-rc1-esp8266.bin.sha256

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [ruijie, x86_64]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Build ImmortalWrt 25.12.2 image
        run: sh experiment/openwrt/BlazePwifi/build/build-openwrt-image.sh ${{ matrix.target }}
      - name: Show fresh output and checksums
        run: |
          ls -lah experiment/openwrt/BlazePwifi/dist/${{ matrix.target }}/
          cat experiment/openwrt/BlazePwifi/dist/${{ matrix.target }}/BUILDINFO.txt
          cat experiment/openwrt/BlazePwifi/dist/${{ matrix.target }}/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: BlazePwifi-1.0.0-rc1-${{ matrix.target }}
          path: experiment/openwrt/BlazePwifi/dist/${{ matrix.target }}/
