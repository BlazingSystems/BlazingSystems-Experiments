name: BlazePwifi build
on:
  workflow_dispatch:
  push:
    paths:
      - 'experiment/openwrt/BlazePwifi/**'
      - '.github/workflows/blazepwifi-build.yml'
  pull_request:
    paths:
      - 'experiment/openwrt/BlazePwifi/**'
      - '.github/workflows/blazepwifi-build.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static validation
        run: sh experiment/openwrt/BlazePwifi/tests/static.sh
      - name: v0.3 foundation validation
        run: sh experiment/openwrt/BlazePwifi/tests/v03_foundation.sh
      - name: Admin security validation
        run: sh experiment/openwrt/BlazePwifi/tests/security.sh
      - name: Config API validation
        run: sh experiment/openwrt/BlazePwifi/tests/config.sh
      - name: Template gallery validation
        run: sh experiment/openwrt/BlazePwifi/tests/template_gallery.sh
      - name: Controller protocol parity
        run: sh experiment/openwrt/BlazePwifi/tests/controllers.sh
      - name: Linux GPIO agent validation
        run: sh experiment/openwrt/BlazePwifi/tests/linux_agent.sh
      - name: BlazeRental source validation
        run: sh experiment/openwrt/BlazePwifi/tests/android.sh
      - name: Portal validation
        run: sh experiment/openwrt/BlazePwifi/tests/portal.sh
      - name: Admin UI validation
        run: sh experiment/openwrt/BlazePwifi/tests/admin_ui.sh
      - name: Accounting integration test x3
        run: |
          for i in 1 2 3; do
            echo "Integration pass $i"
            sh experiment/openwrt/BlazePwifi/tests/integration.sh
          done
      - name: Persistence and replay stress test x3
        run: |
          for i in 1 2 3; do
            echo "Stress pass $i"
            sh experiment/openwrt/BlazePwifi/tests/stress.sh
          done
      - name: Build release bundle
        run: |
          VERSION=$(cat experiment/openwrt/BlazePwifi/VERSION)
          tar -czf "BlazePwifi-${VERSION}.tar.gz" experiment/openwrt/BlazePwifi
          sha256sum "BlazePwifi-${VERSION}.tar.gz" > "BlazePwifi-${VERSION}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: BlazePwifi-bundle
          path: |
            BlazePwifi-*.tar.gz
            BlazePwifi-*.sha256

  esp8266:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP8266 core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266
      - name: Compile BlazePwifi Vendo
        run: |
          mkdir -p experiment/openwrt/BlazePwifi/dist/esp8266
          arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 --output-dir experiment/openwrt/BlazePwifi/dist/esp8266 experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo
          (cd experiment/openwrt/BlazePwifi/dist/esp8266 && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: BlazePwifi-esp8266-firmware
          path: experiment/openwrt/BlazePwifi/dist/esp8266/

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [ruijie, x86_64, orangepi_zero3, orangepi_one, orangepi_pc]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Build OpenWrt image
        run: sh experiment/openwrt/BlazePwifi/build/build-openwrt-image.sh ${{ matrix.target }}
      - name: Verify firmware checksums
        run: |
          cd experiment/openwrt/BlazePwifi/dist/${{ matrix.target }}
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: BlazePwifi-${{ matrix.target }}-firmware
          path: experiment/openwrt/BlazePwifi/dist/${{ matrix.target }}/


  esp32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
      - name: Compile BlazePwifi Vendo ESP32
        run: |
          mkdir -p experiment/openwrt/BlazePwifi/dist/esp32
          arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir experiment/openwrt/BlazePwifi/dist/esp32 experiment/openwrt/BlazePwifi/esp32/BlazePwifiVendo32
          cp experiment/openwrt/BlazePwifi/esp32/BlazePwifiVendo32/BlazePwifiVendo32.ino experiment/openwrt/BlazePwifi/dist/esp32/
          (cd experiment/openwrt/BlazePwifi/dist/esp32 && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: BlazePwifi-esp32-firmware
          path: experiment/openwrt/BlazePwifi/dist/esp32/


  firmware_optional:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        target: [orangepi_pc_plus, orangepi_pc2, orangepi_zero, orangepi_zero2, orangepi_zero2w, orangepi_one_plus]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Build optional OpenWrt image
        run: sh experiment/openwrt/BlazePwifi/build/build-openwrt-image.sh ${{ matrix.target }}
      - name: Verify optional firmware checksums
        run: |
          cd experiment/openwrt/BlazePwifi/dist/${{ matrix.target }}
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: BlazePwifi-${{ matrix.target }}-firmware
          path: experiment/openwrt/BlazePwifi/dist/${{ matrix.target }}/


  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build installable BlazeRental APK
        working-directory: experiment/openwrt/BlazePwifi/android/BlazeRental
        run: |
          gradle --no-daemon :app:assembleDebug
          mkdir -p ../../dist/android
          cp app/build/outputs/apk/debug/app-debug.apk ../../dist/android/BlazeRental.apk
          sha256sum ../../dist/android/BlazeRental.apk > ../../dist/android/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: BlazePwifi-android-BlazeRental
          path: experiment/openwrt/BlazePwifi/dist/android/
