name: BlazePwifi P0 staged accounting regression
on:
  workflow_dispatch:
  push:
    branches:
      - blazepwifi-v0.6.0-audit-foundation
    paths:
      - 'experiment/openwrt/BlazePwifi/tests/v060_member_*_repro.sh'
      - '.github/workflows/blazepwifi-p0-repro.yml'
      - 'experiment/openwrt/BlazePwifi/tests/v060_ledger_model.py'
      - 'experiment/openwrt/BlazePwifi/tools/v060_v1_inventory_fixture.py'
      - 'experiment/openwrt/BlazePwifi/tests/v060_v1_inventory_fixture.py'
      - 'experiment/openwrt/BlazePwifi/tests/v060_journal_native_fixture.sh'
      - 'experiment/openwrt/BlazePwifi/tests/v060_durable_replace_native.sh'
      - 'experiment/openwrt/BlazePwifi/tests/v060_journal_native_auth_endtoend.sh'
      - 'experiment/openwrt/BlazePwifi/tools/v060_durable_replace.c'
      - 'experiment/openwrt/BlazePwifi/tests/v060_journal_auth_fixture.sh'
      - 'experiment/openwrt/BlazePwifi/tools/v060_journal_auth_fixture.sh'
      - 'experiment/openwrt/BlazePwifi/tools/v060_journal_fixture.sh'
      - 'experiment/openwrt/BlazePwifi/tests/v060_rental_receipt_failure_repro.sh'
      - 'experiment/openwrt/BlazePwifi/tests/v060_member_receipt_quota.sh'
      - 'experiment/openwrt/BlazePwifi/tests/v060_rental_receipt_midwrite.sh'
      - 'experiment/openwrt/BlazePwifi/tests/v060_coin_false_ack.sh'
      - 'experiment/openwrt/BlazePwifi/tests/v060_account_write_integrity.sh'
      - 'experiment/openwrt/BlazePwifi/tests/v060_rental_db_integrity.sh'
      - 'experiment/openwrt/BlazePwifi/tests/v060_rental_revoke_safety.sh'
      - 'experiment/openwrt/BlazePwifi/tests/v060_rental_lease_mutation_safety.sh'
      - 'experiment/openwrt/BlazePwifi/tests/rental.sh'
      - 'experiment/openwrt/BlazePwifi/openwrt/rootfs/usr/lib/blazepwifi/rental.sh'
      - 'experiment/openwrt/BlazePwifi/openwrt/rootfs/www/blazepwifi/cgi-bin/rental'
      - 'experiment/openwrt/BlazePwifi/openwrt/rootfs/usr/lib/blazepwifi/common.sh'
      - 'experiment/openwrt/BlazePwifi/tests/v060_coin_replay_window.sh'
      - 'experiment/openwrt/BlazePwifi/tests/v060_member_quarantine_replay.sh'
      - 'experiment/openwrt/BlazePwifi/tests/v060_member_delete_safety.sh'
      - 'experiment/openwrt/BlazePwifi/tests/v060_member_write_fault.sh'
      - 'experiment/openwrt/BlazePwifi/tests/v054_member_migration.sh'
      - 'experiment/openwrt/BlazePwifi/tests/v053_members.sh'
      - 'experiment/openwrt/BlazePwifi/openwrt/rootfs/usr/lib/blazepwifi/member_migration.sh'
      - 'experiment/openwrt/BlazePwifi/tests/v060_member_ui_delete.sh'
      - 'experiment/openwrt/BlazePwifi/openwrt/rootfs/www/blazepwifi/admin/members.js'
      - 'experiment/openwrt/BlazePwifi/openwrt/rootfs/usr/lib/blazepwifi/member.sh'
      - 'experiment/openwrt/BlazePwifi/openwrt/rootfs/www/blazepwifi/cgi-bin/admin'
      - 'experiment/openwrt/BlazePwifi/openwrt/rootfs/usr/lib/blazepwifi/common.sh'
      - 'experiment/openwrt/BlazePwifi/openwrt/rootfs/www/blazepwifi/cgi-bin/vendo'
      - 'experiment/openwrt/BlazePwifi/openwrt/rootfs/www/blazepwifi/cgi-bin/api'
      - 'experiment/openwrt/BlazePwifi/tests/integration.sh'
permissions:
  contents: read
jobs:
  reproduce:
    name: Verify member replay fix, transfer and remaining receipt defects
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate POSIX fixture syntax before functional checks
        run: |
          sh -n experiment/openwrt/BlazePwifi/tools/v060_journal_fixture.sh
          sh -n experiment/openwrt/BlazePwifi/tests/v060_journal_native_fixture.sh
          sh -n experiment/openwrt/BlazePwifi/tools/v060_journal_auth_fixture.sh
          sh -n experiment/openwrt/BlazePwifi/tests/v060_journal_auth_fixture.sh
      - name: Refuse ordinary signed-coin false ACK when account storage fails
        run: sh experiment/openwrt/BlazePwifi/tests/v060_coin_false_ack.sh
      - name: Refuse duplicate paid Wi-Fi account rows and truncated source copy
        run: sh experiment/openwrt/BlazePwifi/tests/v060_account_write_integrity.sh
      - name: Refuse corrupt or incomplete prepaid rental leases
        run: sh experiment/openwrt/BlazePwifi/tests/v060_rental_db_integrity.sh
      - name: Refuse revoking active paid rental time or false ACK after failed removal
        run: sh experiment/openwrt/BlazePwifi/tests/v060_rental_revoke_safety.sh
      - name: Require checked rental paid time addition and confirmed forfeiture
        run: sh experiment/openwrt/BlazePwifi/tests/v060_rental_lease_mutation_safety.sh
      - name: Preserve real signed rental portal and operator lease compatibility
        run: sh experiment/openwrt/BlazePwifi/tests/rental.sh
      - name: Exercise live portal-to-vendo window reuse, write failures and closure
        run: sh experiment/openwrt/BlazePwifi/tests/integration.sh
      - name: Preserve signed-coin replay receipts throughout the live target window
        run: sh experiment/openwrt/BlazePwifi/tests/v060_coin_replay_window.sh
      - name: Refuse member replay ACK under financial quarantine
        run: sh experiment/openwrt/BlazePwifi/tests/v060_member_quarantine_replay.sh
      - name: Reject deletion of remaining member credit and quarantine interrupted admin writes
        run: sh experiment/openwrt/BlazePwifi/tests/v060_member_delete_safety.sh
      - name: Reject partial member database copies and false admin success
        run: sh experiment/openwrt/BlazePwifi/tests/v060_member_write_fault.sh
      - name: Guard stale paid balance in actual member management UI
        run: sh experiment/openwrt/BlazePwifi/tests/v060_member_ui_delete.sh
      - name: Refuse unsigned imported credits and preserve paid bank across metadata update
        run: sh experiment/openwrt/BlazePwifi/tests/v054_member_migration.sh
      - name: Keep original member banking, transfer and password flows compatible
        run: sh experiment/openwrt/BlazePwifi/tests/v053_members.sh
      - name: Verify native POSIX transaction journal fixture (synthetic only)
        run: sh experiment/openwrt/BlazePwifi/tests/v060_journal_native_fixture.sh
      - name: Test native file and parent-directory fsync/rename durability boundaries
        run: sh experiment/openwrt/BlazePwifi/tests/v060_durable_replace_native.sh
      - name: Test signed native member and rental journal atomic receipt replay
        run: sh experiment/openwrt/BlazePwifi/tests/v060_journal_native_auth_endtoend.sh
      - name: Redact and reject corrupt v1 financial inventory before migration
        run: python3 experiment/openwrt/BlazePwifi/tests/v060_v1_inventory_fixture.py
      - name: Refuse unauthenticated v2 controller monetary envelopes (synthetic only)
        run: sh experiment/openwrt/BlazePwifi/tests/v060_journal_auth_fixture.sh
      - name: Verify offline synthetic transactional journal oracle (model only)
        run: python3 experiment/openwrt/BlazePwifi/tests/v060_ledger_model.py
      - name: Verify synthetic expected-RED replay and interrupted transfer
        shell: bash
        run: |
          set -euo pipefail
          checks=(
            'experiment/openwrt/BlazePwifi/tests/v060_member_replay_repro.sh|PASS: acknowledged paid member ID retained and replay did not change banked time|0'
            'experiment/openwrt/BlazePwifi/tests/v060_member_receipt_quota.sh|PASS: paid member quota rejects credit and transfer before mutation, never deletes old receipts|0'
            'experiment/openwrt/BlazePwifi/tests/v060_member_transfer_crash_repro.sh|PASS: transfer outcome atomic at tested interruption boundary|0'
            'experiment/openwrt/BlazePwifi/tests/v060_member_receipt_failure_repro.sh|PASS: member receipt EIO rejects ACK and quarantines all further paid changes|0'
            'experiment/openwrt/BlazePwifi/tests/v060_rental_receipt_failure_repro.sh|PASS: rejected rental receipt failure without changing lease|0'
            'experiment/openwrt/BlazePwifi/tests/v060_rental_receipt_midwrite.sh|PASS: rental late receipt EIO rejects ACK and quarantines further paid mutations|0'
          )
          for item in "${checks[@]}"; do
            file="${item%%|*}"
            rest="${item#*|}"
            signature="${rest%%|*}"
            expected_rc="${rest##*|}"
            log="$(mktemp)"
            set +e
            sh "$file" >"$log" 2>&1
            rc=$?
            set -e
            cat "$log"
            if [[ "$rc" -ne "$expected_rc" ]] || ! grep -Fq "$signature" "$log"; then
              echo "::error::Unexpected result for $file (rc=$rc). Inspect setup and source."
              rm -f "$log"
              exit 1
            fi
            echo "CONFIRMED STAGED RESULT: $file, expected rc=$expected_rc (synthetic only)"
            rm -f "$log"
          done
          echo 'Legacy replay and receipt-EIO fail-closed containment pass; balance+receipt remain non-atomic and production blocked.'
