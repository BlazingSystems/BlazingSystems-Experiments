name: BlazePwifi v0.4 release documentation sync

on:
  push:
    branches: [blazepwifi-v0.4.0-implementation]
    paths:
      - '.github/blazepwifi-v04-release-docs-request.json'
      - '.github/workflows/blazepwifi-v04-release-docs.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.4.0
    steps:
      - uses: actions/checkout@v4

      - name: Verify final release and direct images
        shell: bash
        run: |
          set -euo pipefail
          JSON="$(gh api "repos/${{ github.repository }}/releases/tags/$TAG")"
          printf '%s' "$JSON" | jq -e '.draft == false and .prerelease == false' >/dev/null
          for required in             BlazeRental.apk             BlazePwifi-EW1200G-Pro-v1.1-sysupgrade.bin             BlazePwifi-Vendo-ESP8266.bin             BlazePwifi-Vendo-ESP32.bin             openwrt-25.12.5-x86-64-generic-ext4-combined.img             openwrt-25.12.5-x86-64-generic-ext4-combined-efi.img             openwrt-25.12.5-sunxi-cortexa7-xunlong_orangepi-one-ext4-sdcard.img             openwrt-25.12.5-sunxi-cortexa7-xunlong_orangepi-pc-ext4-sdcard.img             openwrt-25.12.5-sunxi-cortexa53-xunlong_orangepi-zero3-ext4-sdcard.img             DIRECT-IMAGES-SHA256SUMS
          do
            printf '%s' "$JSON" | jq -e --arg n "$required" '.assets[] | select(.name==$n)' >/dev/null               || { echo "release asset missing: $required" >&2; exit 1; }
          done

      - name: Refresh release notes and documentation assets
        shell: bash
        run: |
          set -euo pipefail
          README=experiment/openwrt/BlazePwifi/releases/0.4.0/README.md
          ASSETS=experiment/openwrt/BlazePwifi/releases/0.4.0/ASSETS.md
          gh release edit "$TAG" --repo "${{ github.repository }}"             --title "BlazePwifi v0.4.0 — Launcher Edition"             --notes-file "$README"
          gh release upload "$TAG" "$README" "$ASSETS"             --repo "${{ github.repository }}" --clobber
