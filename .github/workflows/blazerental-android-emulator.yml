name: BlazeRental Android Emulator Audit
on:
  push:
    branches: [blazepwifi-v0.3.0-simulation]
    paths:
      - '.github/workflows/blazerental-android-emulator.yml'
      - 'experiment/openwrt/BlazePwifi/simulation/android_emulator_audit.sh'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.3.0 -R BlazingSystems/BlazingSystems-Experiments -p BlazeRental.apk --clobber
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Run signed APK as Android Device Owner
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: bash experiment/openwrt/BlazePwifi/simulation/android_emulator_audit.sh
      - uses: actions/upload-artifact@v4
        with:
          name: blazepwifi-sim-android
          path: simulation-results/android/
