name: BlazePisonet SoftTimer Windows Release

on:
  pull_request:
    paths:
      - 'experiment/windows/BlazePisonet-SoftTimer/**'
      - '.github/workflows/blazepisonet-softtimer-release.yml'
  push:
    branches: [main]
    paths:
      - 'experiment/windows/BlazePisonet-SoftTimer/**'
      - '.github/workflows/blazepisonet-softtimer-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blazepisonet-softtimer-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_DIR: experiment/windows/BlazePisonet-SoftTimer
  VERSION: 0.1.0
  TAG: softtimer-v0.1.0

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand source bootstrap when present
        id: expand
        shell: pwsh
        run: |
          $bootstrap="$env:PROJECT_DIR/.bootstrap"
          if (Test-Path $bootstrap) {
            $b64=(Get-ChildItem "$bootstrap/part*" | Sort-Object Name | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
            $archive=Join-Path $env:RUNNER_TEMP 'softtimer-source.tar.gz'
            [IO.File]::WriteAllBytes($archive,[Convert]::FromBase64String($b64))
            tar -xzf $archive -C .
            "had_archive=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "had_archive=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Materialize readable source on main
        id: materialize
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.expand.outputs.had_archive == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r -f "$env:PROJECT_DIR/.bootstrap"
          git add "$env:PROJECT_DIR"
          if (git diff --cached --quiet) {
            "did=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            git commit -m "source: materialize BlazePisonet SoftTimer v$env:VERSION"
            git push origin HEAD:main
            "did=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore "$env:PROJECT_DIR/src/BlazePisonet.SoftTimer/BlazePisonet.SoftTimer.csproj"
          dotnet restore "$env:PROJECT_DIR/src/BlazePisonet.SoftTimer.Watchdog/BlazePisonet.SoftTimer.Watchdog.csproj"

      - name: Build
        shell: pwsh
        run: |
          dotnet build "$env:PROJECT_DIR/src/BlazePisonet.SoftTimer/BlazePisonet.SoftTimer.csproj" -c Release --no-restore -warnaserror
          dotnet build "$env:PROJECT_DIR/src/BlazePisonet.SoftTimer.Watchdog/BlazePisonet.SoftTimer.Watchdog.csproj" -c Release --no-restore -warnaserror

      - name: Publish self-contained Windows x64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/app,out/watchdog,package/app,package/installer,package/docs | Out-Null
          dotnet publish "$env:PROJECT_DIR/src/BlazePisonet.SoftTimer/BlazePisonet.SoftTimer.csproj" -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o out/app
          dotnet publish "$env:PROJECT_DIR/src/BlazePisonet.SoftTimer.Watchdog/BlazePisonet.SoftTimer.Watchdog.csproj" -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o out/watchdog
          Copy-Item out/app/* package/app/ -Force
          Copy-Item out/watchdog/BlazePisonet.SoftTimer.Watchdog.exe package/app/ -Force
          Copy-Item "$env:PROJECT_DIR/installer/*" package/installer/ -Recurse -Force
          Copy-Item "$env:PROJECT_DIR/docs/*" package/docs/ -Recurse -Force
          Copy-Item "$env:PROJECT_DIR/README.md" package/README.md -Force
          Copy-Item "$env:PROJECT_DIR/RELEASE_NOTES_v0.1.0.md" package/RELEASE_NOTES.md -Force

      - name: Package and checksum
        shell: pwsh
        run: |
          $zip="BlazePisonet-SoftTimer-v$env:VERSION-win-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path package/* -DestinationPath $zip -CompressionLevel Optimal
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content -Encoding ascii SHA256SUMS
          if (-not (Test-Path package/app/BlazePisonet.SoftTimer.exe)) { throw 'SoftTimer EXE missing' }
          if (-not (Test-Path package/app/BlazePisonet.SoftTimer.Watchdog.exe)) { throw 'Watchdog EXE missing' }
          Get-Item $zip,package/app/BlazePisonet.SoftTimer.exe,package/app/BlazePisonet.SoftTimer.Watchdog.exe | Format-Table Name,Length
          Get-Content SHA256SUMS

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlazePisonet-SoftTimer-v0.1.0-win-x64
          path: |
            BlazePisonet-SoftTimer-v0.1.0-win-x64.zip
            SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.expand.outputs.had_archive == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip="BlazePisonet-SoftTimer-v$env:VERSION-win-x64.zip"
          if (gh release view $env:TAG *> $null) {
            gh release upload $env:TAG $zip SHA256SUMS --clobber
          } else {
            gh release create $env:TAG $zip SHA256SUMS --title "BlazePisonet SoftTimer v$env:VERSION" --notes-file "$env:PROJECT_DIR/RELEASE_NOTES_v0.1.0.md" --target $env:GITHUB_SHA
          }
