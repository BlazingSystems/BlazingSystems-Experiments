<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Token Control Prototype Preview</title>
<style>body{margin:0;background:#0c1218;color:#eef5fb;font:14px/1.5 system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:20px}.box{width:min(480px,100%);background:#151e28;border:1px solid #304154;border-radius:16px;padding:20px}.muted{color:#9cafc1}.time{font-size:46px;font-weight:800}button{width:100%;padding:10px;border:1px solid #36516d;border-radius:9px;background:#183b5d;color:#fff;cursor:pointer;margin-top:8px}</style></head><body><main class="box"><h1>Token Control Prototype</h1><p class="muted">Portfolio preview only. No device administration or network connection is performed.</p><div class="time" id="t">00:00</div><button id="add">Add 10-minute sample token</button><button id="tick">Simulate 1 minute elapsed</button><p id="state" class="muted">No active time credit.</p><script>let m=0;function draw(){t.textContent=String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');state.textContent=m?'Synthetic session active':'No active time credit.'}add.onclick=()=>{m+=10;draw()};tick.onclick=()=>{m=Math.max(0,m-1);draw()};draw();</script></main></body></html>
