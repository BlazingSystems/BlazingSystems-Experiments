<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESP8266 Relay Controller Preview</title>
<style>body{margin:0;background:#0b1118;color:#eef4fb;font:14px/1.5 system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:20px}.panel{width:min(520px,100%);background:#151e29;border:1px solid #304258;border-radius:16px;padding:20px}.muted{color:#9bafc3}.state{font-size:40px;font-weight:800}button{width:100%;padding:10px;margin-top:8px;border-radius:8px;border:1px solid #36516b;background:#183b5d;color:#fff;cursor:pointer}.on{color:#70d890}</style></head><body><main class="panel"><h1>ESP8266 Relay Controller</h1><p class="muted">Browser-only preview; no electrical load is connected.</p><div id="state" class="state">OFF</div><button id="toggle">Toggle Relay</button><button id="pulse">Simulate 1-second Pulse</button><p class="muted">Hardware projects require isolation, rated switching components, and target-board testing.</p><script>let on=false;function d(){state.textContent=on?'ON':'OFF';state.className='state'+(on?' on':'')}toggle.onclick=()=>{on=!on;d()};pulse.onclick=()=>{on=true;d();setTimeout(()=>{on=false;d()},1000)};d();</script></main></body></html>
