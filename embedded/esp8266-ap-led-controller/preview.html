<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESP8266 LED Controller Preview</title>
<style>body{margin:0;background:#0b1118;color:#eef4fb;font:14px/1.5 system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:20px}.panel{width:min(480px,100%);background:#151e29;border:1px solid #304258;border-radius:16px;padding:20px}.lamp{width:120px;height:120px;margin:18px auto;border-radius:50%;background:#263442;box-shadow:0 0 0 1px #3a4e65}.lamp.on{background:#f4f7ff;box-shadow:0 0 50px #fff8}.muted{color:#9bafc3}button,input,select{width:100%;box-sizing:border-box;margin-top:8px;padding:10px;border-radius:8px;border:1px solid #36516b;background:#0c151f;color:#fff}</style></head><body><main class="panel"><h1>ESP8266 LED Controller</h1><p class="muted">Static device-interface simulation. No ESP8266 connection is made.</p><div id="lamp" class="lamp"></div><button id="toggle">Toggle Output</button><label>Intensity</label><input id="intensity" type="range" min="0" max="100" value="70"><p id="label" class="muted">Output off</p><script>let on=false;function d(){lamp.classList.toggle('on',on);lamp.style.opacity=on?Math.max(.2,+intensity.value/100):1;label.textContent=on?'Output on · '+intensity.value+'%':'Output off'}toggle.onclick=()=>{on=!on;d()};intensity.oninput=d;d();</script></main></body></html>
